[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tidyup"
version = "0.1.0"
description = "A small, safe file organizer: sort a messy folder into categories, or by date, with one-command undo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pdev-labs" }]
keywords = ["files", "organizer", "cli", "productivity", "cleanup"]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.scripts]
tidyup = "tidyup.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tidyup"]

[tool.hatch.build.targets.wheel]
packages = ["src/tidyup"]
